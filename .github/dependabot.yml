# Dependabot version updates.
# Security updates are enabled separately in the repo's Security settings.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Astro site — the only npm manifest in the repo (root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    # Grouping keeps related packages moving in lock-step and cuts PR noise.
    # A dependency lands in the FIRST group whose patterns match it.
    # Every group is limited to minor + patch so a major always arrives as
    # its own PR and is decided on its own.
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
        update-types:
          - minor
          - patch
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
        update-types:
          - minor
          - patch
      # Everything else: one weekly PR for minor + patch bumps.
      # Major bumps of ungrouped packages still get their own PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # No ignored majors right now. If one gets deferred, add it here AND
    # restore .github/workflows/major-upgrade-watch.yml so it stays visible
    # (see pedant-studios-docs for the workflow + script to copy).

  # Actions used by .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
